[project]
name = "dsa-server"
version = "0.1.0"
description = "The DSA Editor's server: the API, your files on disk, Piston and Claude."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.120.0",
    "uvicorn[standard]==0.38.0",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "watchfiles==1.1.1",
    "pydantic==2.12.3",
    "claude-agent-sdk==0.2.174",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
