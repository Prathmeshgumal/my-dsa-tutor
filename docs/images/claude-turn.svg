<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1000" height="470" rx="16" fill="#0f0f17"/>
  <text x="40" y="44" fill="#fff" font-size="20" font-weight="700">One Claude reply, step by step</text>
  <text x="40" y="68" fill="#a1a1b5" font-size="13">Example: "Add an edge case: a single column [[1],[2],[3],[4]]"</text>

  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="40" y="90" width="170" height="44" rx="10" fill="#1a1a28" stroke="#8b5cf6"/><text x="125" y="117">You (browser)</text>
    <rect x="290" y="90" width="170" height="44" rx="10" fill="#1a1a28" stroke="#6366f1"/><text x="375" y="117">Editor server</text>
    <rect x="540" y="90" width="190" height="44" rx="10" fill="#1a1a28" stroke="#8b5cf6"/><text x="635" y="117">Claude Code engine</text>
    <rect x="810" y="90" width="150" height="44" rx="10" fill="#1a1a28" stroke="#a1a1b5"/><text x="885" y="117">Claude</text>
  </g>
  <g stroke="#2e2e44" stroke-width="2" stroke-dasharray="4 5">
    <line x1="125" y1="134" x2="125" y2="450"/><line x1="375" y1="134" x2="375" y2="450"/>
    <line x1="635" y1="134" x2="635" y2="450"/><line x1="885" y1="134" x2="885" y2="450"/>
  </g>

  <g font-size="12.5" fill="#e4e4f0" stroke-width="2" fill-opacity="1">
    <path d="M125,166 H371" stroke="#8b5cf6" marker-end="url(#b)"/><text x="248" y="158" text-anchor="middle">message + open problem</text>
    <path d="M375,204 H631" stroke="#6366f1" marker-end="url(#b)"/><text x="505" y="196" text-anchor="middle">start: system prompt + editor tools only</text>
    <path d="M635,240 H881" stroke="#8b5cf6" marker-end="url(#b)"/><text x="760" y="232" text-anchor="middle">question + tool list</text>
    <path d="M885,276 H639" stroke="#a1a1b5" marker-end="url(#b)"/><text x="760" y="268" text-anchor="middle">tool call: add_test_case</text>
    <path d="M635,312 H379" stroke="#6366f1" marker-end="url(#b)"/><text x="505" y="304" text-anchor="middle">run editor tool (MCP message)</text>
    <path d="M375,348 H129" stroke="#f59e0b" marker-end="url(#b)"/><text x="250" y="340" text-anchor="middle" fill="#fcd34d">proposal card: Apply / Reject</text>
    <path d="M125,384 H371" stroke="#22c55e" marker-end="url(#b)"/><text x="248" y="376" text-anchor="middle" fill="#86efac">you click Apply → test case saved</text>
    <path d="M379,420 H635" stroke="#6366f1" marker-end="url(#b)" marker-start="url(#b)"/><text x="505" y="412" text-anchor="middle">result → Claude → reply text</text>
    <path d="M371,446 H129" stroke="#8b5cf6" marker-end="url(#b)"/><text x="250" y="440" text-anchor="middle">streamed (SSE)</text>
  </g>
</svg>
