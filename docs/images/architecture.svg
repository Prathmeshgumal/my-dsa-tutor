<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1b5"/></marker>
  </defs>
  <rect width="1000" height="560" rx="16" fill="#0f0f17"/>
  <text x="40" y="44" fill="#ffffff" font-size="20" font-weight="700">How DSA Editor fits together</text>
  <text x="40" y="68" fill="#a1a1b5" font-size="13">Everything runs on your machine with docker compose. Only Claude's replies go out to Anthropic.</text>

  <!-- browser -->
  <rect x="40" y="110" width="220" height="150" rx="12" fill="#1a1a28" stroke="#8b5cf6" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Your browser</text>
  <text x="150" y="164" text-anchor="middle" fill="#c4b5fd" font-size="12">React 19 · Monaco · Tailwind</text>
  <text x="58" y="194" fill="#a1a1b5" font-size="12">• Problems, Code, Notes</text>
  <text x="58" y="214" fill="#a1a1b5" font-size="12">• Dry-run Playground</text>
  <text x="58" y="234" fill="#a1a1b5" font-size="12">• Claude panel, Apply / Reject</text>

  <!-- server -->
  <rect x="340" y="96" width="300" height="420" rx="14" fill="#151522" stroke="#6366f1" stroke-width="2"/>
  <text x="490" y="126" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Editor server</text>
  <text x="490" y="146" text-anchor="middle" fill="#a5b4fc" font-size="12">Python · Uvicorn · 127.0.0.1:5199</text>
  <rect x="360" y="166" width="260" height="62" rx="9" fill="#1f1f30"/>
  <text x="376" y="190" fill="#fff" font-size="13" font-weight="600">File stores + folder watcher</text>
  <text x="376" y="210" fill="#a1a1b5" font-size="12">safe writes; outside edits pushed live</text>
  <rect x="360" y="240" width="260" height="62" rx="9" fill="#1f1f30"/>
  <text x="376" y="264" fill="#fff" font-size="13" font-weight="600">/piston proxy</text>
  <text x="376" y="284" fill="#a1a1b5" font-size="12">runs + WebSocket for typed input</text>
  <rect x="360" y="314" width="260" height="62" rx="9" fill="#1f1f30"/>
  <text x="376" y="338" fill="#fff" font-size="13" font-weight="600">Test judge</text>
  <text x="376" y="358" fill="#a1a1b5" font-size="12">your class Solution + hidden main()</text>
  <rect x="360" y="388" width="260" height="110" rx="9" fill="#1f1f30" stroke="#8b5cf6" stroke-dasharray="5 4"/>
  <text x="376" y="412" fill="#fff" font-size="13" font-weight="600">Claude routes + editor tools</text>
  <text x="376" y="432" fill="#a1a1b5" font-size="12">replies stream as server-sent events</text>
  <text x="376" y="452" fill="#a1a1b5" font-size="12">21 editor tools, nothing else</text>
  <text x="376" y="472" fill="#a1a1b5" font-size="12">changes wait for your Apply</text>

  <!-- right column -->
  <rect x="720" y="110" width="240" height="96" rx="12" fill="#1a1a28" stroke="#22c55e" stroke-width="2"/>
  <text x="840" y="138" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Your folders</text>
  <text x="840" y="162" text-anchor="middle" fill="#a1a1b5" font-size="12">solutions/ notes/ problems/</text>
  <text x="840" y="182" text-anchor="middle" fill="#a1a1b5" font-size="12">playground/ state/ (plain files)</text>

  <rect x="720" y="232" width="240" height="96" rx="12" fill="#1a1a28" stroke="#f59e0b" stroke-width="2"/>
  <text x="840" y="260" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Piston container</text>
  <text x="840" y="284" text-anchor="middle" fill="#a1a1b5" font-size="12">sandboxed C++, Java, Python</text>
  <text x="840" y="304" text-anchor="middle" fill="#a1a1b5" font-size="12">pinned image, no API key</text>

  <rect x="720" y="372" width="240" height="70" rx="12" fill="#1a1a28" stroke="#8b5cf6" stroke-width="2"/>
  <text x="840" y="400" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Claude Code engine</text>
  <text x="840" y="422" text-anchor="middle" fill="#a1a1b5" font-size="12">child process, JSON lines</text>

  <rect x="720" y="470" width="240" height="60" rx="12" fill="#1a1a28" stroke="#a1a1b5" stroke-dasharray="6 4"/>
  <text x="840" y="496" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Claude (Anthropic)</text>
  <text x="840" y="516" text-anchor="middle" fill="#a1a1b5" font-size="12">your Claude subscription</text>

  <!-- arrows -->
  <path d="M260,170 H336" stroke="#a1a1b5" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="298" y="160" text-anchor="middle" fill="#a1a1b5" font-size="11">HTTP</text>
  <path d="M260,230 C300,230 310,430 356,440" stroke="#a1a1b5" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="270" y="300" fill="#a1a1b5" font-size="11">SSE</text>
  <path d="M620,197 H716" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M620,271 H716" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M620,345 C670,345 670,290 716,290" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M620,420 C670,420 680,407 716,407" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="668" y="440" text-anchor="middle" fill="#c4b5fd" font-size="11">tool calls</text>
  <path d="M840,442 V466" stroke="#a1a1b5" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
