# Everything the editor needs: `docker compose up -d`, then open http://localhost:5199
services:
  # Runs submitted code: https://github.com/engineer-man/piston
  piston:
    # Pinned, so an upstream update can't change how code runs. piston/api-v2.js is patched against this
    # exact version: re-copy it if you change the image.
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    container_name: dsa-piston
    restart: unless-stopped
    privileged: true # Piston needs this to sandbox submitted code
    environment:
      # The longest a run may take. Runs you type into wait for you, so this allows 2 minutes;
      # the editor asks for 3 seconds on runs without typing (tests, Claude's runs).
      PISTON_RUN_TIMEOUT: "120000"
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
      # Makes Stop (and closing the tab) end the program instead of leaving it running until its time limit.
      - ./piston/api-v2.js:/piston_api/src/api/v2.js:ro
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711

  # One-off: installs the C++, Java and Python runtimes into Piston (skips ones already installed).
  piston-setup:
    image: curlimages/curl:8.11.1
    depends_on: [piston]
    environment:
      PISTON_URL: http://piston:2000
    volumes:
      - ./scripts/piston-install.sh:/piston-install.sh:ro
    entrypoint: ["sh", "/piston-install.sh"]
    restart: "no"

  # The editor itself: the page, its file-saving and Claude chat endpoints, on one small Node server.
  editor:
    build: ./app
    container_name: dsa-editor
    restart: unless-stopped
    depends_on: [piston]
    # Run as you, so files written to solutions/ stay yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /home/node
      PISTON_URL: http://piston:2000
      # Your data folders below are mounted here.
      DATA_DIR: /workspace
      # Your Claude login, made with `claude setup-token` and saved in .env by ./start.sh.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "127.0.0.1:${EDITOR_PORT:-5199}:5199"
    volumes:
      - ./solutions:/workspace/solutions
      - ./notes:/workspace/notes
      - ./playground:/workspace/playground
      - ./problems:/workspace/problems
      # The editor's log file (Setup → Copy diagnostics includes its end).
      - ./logs:/workspace/logs
      # What you had open, your chats and settings.
      - ./state:/workspace/state
      # Claude's own folder for this editor's chats. Your ~/.claude stays private to you.
      - claude-home:/home/node/.claude

volumes:
  piston-packages:
  claude-home:
