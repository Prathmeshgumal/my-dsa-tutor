# Checks every push and pull request: types, lint, unit tests, build, the server's tests and the browser tests.
name: CI

# Pushes to main, and pull requests (which cover pushes to their branch), so nothing runs twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.19
          python-version: 3.14.7
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: uv sync --project server --frozen
      - name: Server tests
        run: uv run --project server pytest server/tests -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7
