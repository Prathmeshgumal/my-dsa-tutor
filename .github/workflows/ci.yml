# Checks every push and pull request: types, lint, unit tests, build and the browser tests.
name: CI

# Pushes to main, and pull requests (which cover pushes to their branch), so nothing runs twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7

  # The Python server (app/server): its own tests, the checks that it behaves exactly like the Node server
  # (both are started and compared), and the browser tests against it.
  python-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.19
          python-version: 3.14.7
      - run: npm ci
      - run: npm run build
      - run: uv sync --project server --frozen
      - name: Tests against the Python server
        run: CONTRACT_SERVER=python uv run --project server pytest server/tests -q
      - name: The same contract tests against the Node server
        run: CONTRACT_SERVER=node uv run --project server pytest server/tests/contract -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-python
          path: app/test-results
          retention-days: 7
